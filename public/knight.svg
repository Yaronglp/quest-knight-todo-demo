<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Medieval Knight Icon -->
  
  <!-- Shield (behind knight) -->
  <path d="M 28 45 Q 28 40 32 40 L 38 40 Q 42 40 42 45 L 42 65 Q 37 72 35 72 Q 33 72 28 65 Z" 
        fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
  
  <!-- Shield emblem -->
  <rect x="32" y="48" width="6" height="12" fill="#fbbf24"/>
  <rect x="30" y="54" width="10" height="2" fill="#fbbf24"/>
  
  <!-- Sword (in hand) -->
  <line x1="65" y1="35" x2="75" y2="15" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <line x1="65" y1="35" x2="85" y2="22" stroke="#94a3b8" stroke-width="4"/>
  
  <!-- Sword crossguard -->
  <line x1="60" y1="38" x2="70" y2="32" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Sword handle -->
  <line x1="62" y1="40" x2="67" y2="36" stroke="#8b5e3c" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Sword pommel -->
  <circle cx="61" cy="41" r="2" fill="#d97706"/>
  
  <!-- Body armor (chest plate) -->
  <path d="M 42 48 L 42 75 Q 42 80 50 80 Q 58 80 58 75 L 58 48 Q 58 45 50 45 Q 42 45 42 48 Z" 
        fill="#94a3b8" stroke="#475569" stroke-width="2"/>
  
  <!-- Armor segments -->
  <line x1="42" y1="55" x2="58" y2="55" stroke="#64748b" stroke-width="1"/>
  <line x1="42" y1="62" x2="58" y2="62" stroke="#64748b" stroke-width="1"/>
  <line x1="42" y1="69" x2="58" y2="69" stroke="#64748b" stroke-width="1"/>
  
  <!-- Helmet -->
  <ellipse cx="50" cy="32" rx="12" ry="14" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
  
  <!-- Helmet top (rounded dome) -->
  <path d="M 38 30 Q 38 20 50 18 Q 62 20 62 30" fill="#cbd5e0" stroke="#475569" stroke-width="1.5"/>
  
  <!-- Visor (T-shaped opening) -->
  <rect x="47" y="28" width="6" height="8" fill="#1e293b" stroke="#0f172a" stroke-width="1"/>
  <rect x="42" y="30" width="16" height="3" fill="#1e293b" stroke="#0f172a" stroke-width="1"/>
  
  <!-- Helmet plume holder -->
  <circle cx="50" cy="18" r="2" fill="#d97706"/>
  
  <!-- Plume/feather -->
  <path d="M 50 18 Q 48 10 46 8 M 50 18 Q 50 8 50 6 M 50 18 Q 52 10 54 8" 
        stroke="#dc2626" stroke-width="2" stroke-linecap="round" fill="none"/>
  
  <!-- Shoulder guards (pauldrons) -->
  <ellipse cx="40" cy="46" rx="6" ry="5" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
  <ellipse cx="60" cy="46" rx="6" ry="5" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
  
  <!-- Left arm (holding shield) -->
  <rect x="32" y="48" width="4" height="18" rx="2" fill="#64748b" stroke="#475569" stroke-width="1.5"/>
  
  <!-- Right arm (holding sword) -->
  <path d="M 60 48 L 63 42 L 65 40" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Gauntlet (right hand) -->
  <rect x="61" y="39" width="4" height="5" rx="1" fill="#64748b" stroke="#475569" stroke-width="1"/>
  
  <!-- Gauntlet (left hand) -->
  <rect x="32" y="62" width="4" height="5" rx="1" fill="#64748b" stroke="#475569" stroke-width="1"/>
  
  <!-- Belt -->
  <rect x="42" y="72" width="16" height="4" fill="#8b5e3c" stroke="#6b4423" stroke-width="1"/>
  <circle cx="50" cy="74" r="2" fill="#d97706"/>
  
  <!-- Legs (armored) -->
  <rect x="44" y="80" width="5" height="16" rx="1" fill="#64748b" stroke="#475569" stroke-width="1.5"/>
  <rect x="51" y="80" width="5" height="16" rx="1" fill="#64748b" stroke="#475569" stroke-width="1.5"/>
  
  <!-- Knee guards -->
  <ellipse cx="46.5" cy="86" rx="3.5" ry="3" fill="#94a3b8" stroke="#475569" stroke-width="1"/>
  <ellipse cx="53.5" cy="86" rx="3.5" ry="3" fill="#94a3b8" stroke="#475569" stroke-width="1"/>
  
  <!-- Boots -->
  <rect x="42" y="94" width="6" height="4" rx="1" fill="#3f3f46" stroke="#27272a" stroke-width="1"/>
  <rect x="51" y="94" width="6" height="4" rx="1" fill="#3f3f46" stroke="#27272a" stroke-width="1"/>
</svg>

